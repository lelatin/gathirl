<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Même sceau que le logo de l'en-tête (cercle, cercle pointillé, étoile à 4 branches), rouge néon -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#e3283a" filter="url(#glow)">
    <circle cx="16" cy="16" r="14" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="9.5" stroke-width="1" stroke-dasharray="2 2.4"/>
    <path d="M16 4.5 18.2 13.8 27.5 16l-9.3 2.2L16 27.5l-2.2-9.3L4.5 16l9.3-2.2Z" fill="#e3283a" stroke="none"/>
  </g>
</svg>
