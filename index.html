    <div class="hud__inner">

        <span class="logo__word">Gathirl</span>
      </a>

      <nav class="hud__nav" aria-label="Navigation principale">
        <a href="#/" data-nav="home"><span class="hud__num">1</span>Taverne</a>
        <a href="#/parties" data-nav="parties"><span class="hud__num">2</span>Parties</a>
        <a href="#/messages" data-nav="messages"><span class="hud__num">3</span>Missives<span class="dot" data-unread hidden></span></a>
        <a href="#/profil" data-nav="profil"><span class="hud__num">4</span>Ma fiche</a>
      </nav>

      <div class="hud__right" id="hud-auth"><!-- rempli par JS --></div>
    </div>
    <div class="hud__ticker" aria-hidden="true">
      <span>✦ GRIMOIRE DES RENCONTRES</span>
      <span class="hud__status"><i class="led"></i><span id="hud-clock">--:--</span> · EN LIGNE</span>
      <span class="hud__mode" id="hud-mode"></span>
    </div>
  </header>
